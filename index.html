<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ilja van Heugten</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      padding: 24px;
    }

    .project {
      margin-bottom: 40px;
    }

    .project-meta {
      margin-bottom: 6px;
    }

    .project-top {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 2px;
    }

    .project-tag {
      font-size: 15px;
      font-weight: 700;
      background: #fff;
      color: #000;
      padding: 0;
      white-space: nowrap;
      line-height: 1;
    }

    .project-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .project-role {
      font-size: 15px;
      font-weight: 400;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      display: block;
    }

    .project-role-inner {
      display: inline-block;
      white-space: nowrap;
    }

    .project-role-inner.scrolling {
      animation: marquee 3s linear infinite;
    }

    @keyframes marquee {
      0%   { transform: translateX(0); }
      85%  { transform: translateX(var(--scroll-amount)); }
      86%  { transform: translateX(0); animation-timing-function: step-end; }
      100% { transform: translateX(0); }
    }

    .project-images {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .project-images::-webkit-scrollbar {
      display: none;
    }

    .project-images img {
      flex: 0 0 auto;
      height: 160px;
      width: auto;
      object-fit: cover;
      display: block;
      filter: contrast(1);
    }
  </style>
</head>
<body>

  <div class="project">
    <div class="project-meta">
      <div class="project-top">
        <span class="project-tag">short</span>
        <span class="project-title">de ijzeren jungle</span>
      </div>
      <div class="project-role"><span class="project-role-inner">gaffer & colorist</span></div>
    </div>
    <div class="project-images">
      <img src="DeIJzerenJungle/01.webp" alt="de ijzeren jungle">
      <img src="DeIJzerenJungle/02.webp" alt="de ijzeren jungle">
      <img src="DeIJzerenJungle/03.webp" alt="de ijzeren jungle">
      <img src="DeIJzerenJungle/04.webp" alt="de ijzeren jungle">
      <img src="DeIJzerenJungle/05.webp" alt="de ijzeren jungle">
      <img src="DeIJzerenJungle/06.webp" alt="de ijzeren jungle">
      <img src="DeIJzerenJungle/07.webp" alt="de ijzeren jungle">
      <img src="DeIJzerenJungle/08.webp" alt="de ijzeren jungle">
      <img src="DeIJzerenJungle/09.webp" alt="de ijzeren jungle">
    </div>
  </div>

  <div class="project">
    <div class="project-meta">
      <div class="project-top">
        <span class="project-tag">short</span>
        <span class="project-title">even voor eeuwig</span>
      </div>
      <div class="project-role"><span class="project-role-inner">director of photography, gaffer & colorist</span></div>
    </div>
    <div class="project-images">
      <img src="EvenVoorEeuwig/01.webp" alt="even voor eeuwig">
      <img src="EvenVoorEeuwig/02.webp" alt="even voor eeuwig">
      <img src="EvenVoorEeuwig/03.webp" alt="even voor eeuwig">
      <img src="EvenVoorEeuwig/04.webp" alt="even voor eeuwig">
      <img src="EvenVoorEeuwig/05.webp" alt="even voor eeuwig">
      <img src="EvenVoorEeuwig/06.webp" alt="even voor eeuwig">
    </div>
  </div>

  <div class="project">
    <div class="project-meta">
      <div class="project-top">
        <span class="project-tag">short</span>
        <span class="project-title">levenseter</span>
      </div>
      <div class="project-role"><span class="project-role-inner">director of photography, gaffer & colorist</span></div>
    </div>
    <div class="project-images">
      <img src="Levenseter/01.webp" alt="levenseter">
      <img src="Levenseter/02.webp" alt="levenseter">
      <img src="Levenseter/03.webp" alt="levenseter">
      <img src="Levenseter/04.webp" alt="levenseter">
      <img src="Levenseter/05.webp" alt="levenseter">
      <img src="Levenseter/06.webp" alt="levenseter">
      <img src="Levenseter/07.webp" alt="levenseter">
      <img src="Levenseter/08.webp" alt="levenseter">
      <img src="Levenseter/09.webp" alt="levenseter">
    </div>
  </div>
  <script>
    document.querySelectorAll('.project-role-inner').forEach(role => {
      const wrap = role.parentElement;
      const overflow = role.scrollWidth - wrap.clientWidth;
      if (overflow > 0) {
        role.style.setProperty('--scroll-amount', `-${overflow}px`);
        role.classList.add('scrolling');
      }
    });
  </script>

</body>
</html>
