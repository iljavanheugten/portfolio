<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>films – ilja van heugten</title>
  <link rel="icon" type="image/jpeg" href="/favicon.jpg">
  <link rel="apple-touch-icon" href="/favicon.jpg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      padding: 24px;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 40px;
    }

    .top-row a {
      color: #fff;
      text-decoration: underline;
    }

    .top-name {
      font-size: 15px;
      font-weight: 400;
      color: #fff;
    }

    .project {
      margin-bottom: 40px;
    }

    .project-top {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
    }

    .project-tag {
      font-size: 15px;
      font-weight: 700;
      background: #fff;
      color: #000;
      padding: 0;
      white-space: nowrap;
      line-height: 1;
    }

    .project-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    video {
      display: block;
      width: 100%;
      max-height: 85vh;
      background: #000;
    }
  </style>
</head>
<body>

  <div class="top-row">
    <a href="/" class="top-name">ilja van heugten</a>
  </div>

  <div id="list"></div>

  <script>
    var LIST_URL = "https://films.iljavanheugten.workers.dev/";
    var BASE = "https://pub-6c1cbe22126747058f165aa6b1f95b6d.r2.dev/";

    // DeIJzerenJungle_v1.mov -> "de ijzeren jungle"
    function niceName(key) {
      return key
        .replace(/\.[^.]+$/, "")
        .replace(/_v\d+$/i, "")
        .replace(/([a-z])([A-Z])/g, "$1 $2")
        .replace(/[_-]+/g, " ")
        .toLowerCase();
    }

    fetch(LIST_URL).then(function (r) { return r.json(); }).then(function (files) {
      var list = document.getElementById("list");
      files.forEach(function (f) {
        var project = document.createElement("div");
        project.className = "project";

        var top = document.createElement("div");
        top.className = "project-top";
        var tag = document.createElement("span");
        tag.className = "project-tag";
        tag.textContent = "short";
        var title = document.createElement("span");
        title.className = "project-title";
        title.textContent = niceName(f.key);
        top.appendChild(tag);
        top.appendChild(title);

        var video = document.createElement("video");
        video.src = BASE + f.key.split("/").map(encodeURIComponent).join("/");
        video.controls = true;
        video.playsInline = true;
        video.preload = "metadata";

        project.appendChild(top);
        project.appendChild(video);
        list.appendChild(project);
      });
    });
  </script>

</body>
</html>
